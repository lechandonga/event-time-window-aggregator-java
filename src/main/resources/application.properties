server.port=0

# ---- Event-time window aggregator (etwa) configuration ----
# Local directory holding events.wal.log, checkpoint.json, results.jsonl, dead-letters.jsonl
etwa.data-dir=./data
# Tumbling window size and allowed lateness, both in event-time milliseconds
etwa.window-size-ms=10000
etwa.allowed-lateness-ms=5000
# Bounded ingress->consumer backlog; overflow returns HTTP 503 QUEUE_FULL
etwa.queue-capacity=1000
# Result sink retry policy
etwa.sink-max-attempts=3
etwa.sink-backoff-ms=50
etwa.poll-idle-ms=5
